# Starts MySQL and both microservices:   docker compose up --build
services:

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
    ports:
      - "3306:3306"
    volumes:
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 5s
      timeout: 5s
      retries: 20

  patient-service:
    build: ./patient-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/patients_db
      SPRING_DATASOURCE_USERNAME: patients_user
      SPRING_DATASOURCE_PASSWORD: patients_pass
    depends_on:
      mysql:
        condition: service_healthy

  appointment-service:
    build: ./appointment-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/appointments_db
      SPRING_DATASOURCE_USERNAME: appointments_user
      SPRING_DATASOURCE_PASSWORD: appointments_pass
      # Inside Docker, services find each other by service name
      PATIENT_SERVICE_URL: http://patient-service:8081
    depends_on:
      mysql:
        condition: service_healthy
      patient-service:
        condition: service_started

volumes:
  mysql-data:
